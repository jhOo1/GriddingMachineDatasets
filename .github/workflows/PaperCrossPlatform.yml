name: Paper cross-platform tests

on:
  push:
    branches:
      - paper-release
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Julia 1.12.6 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.6"
      - uses: julia-actions/cache@v2
      - name: Instantiate frozen paper dependencies
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run configuration and package integration tests
        env:
          GMD_RUN_INTEGRATION_TESTS: "true"
        run: julia --startup-file=no --project=. test/runtests.jl
      - name: Archive resolved platform manifest
        uses: actions/upload-artifact@v4
        with:
          name: GriddingMachineDatasets-manifest-${{ runner.os }}
          path: Manifest.toml

