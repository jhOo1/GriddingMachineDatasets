# File name patterns
# Note that if YYYY does not exist, then it is not a duplicated task
# These keys are mandatory:
#     - PATTERN
#     - PREFIX
#     - NX
#     - MT
#     - VV
FILE:
  PATTERN : "PREFIX_NX_MT_VV.nc"
  PREFIX  : ["CI"]
  NX      : [2]
  MT      : ["1Y"]
  VV      : ["V1"]

# Folder structure for input and output
FOLDER:
  ORIGINAL    : "v0"
  REPROCESSED : "v0"

# Data configuration
# Note that the labels should match the PREFIX in FILE section
DATA:
  ABOUT          : "CI from Croft H. et al.(2012) (https://doi.org/10.1016/j.rse.2011.12.008)"
  CHANGE_LOGS    : ["The original file used GeoTIFF, and we converted it to NetCDF", "The original lat was from north to south, and we reorgainized it from south to north", "There was no uncertainty included, and we added an empty matrix filled with NaN","The data was regridded to 0.5 degree by avreaging not NaN values in the new pixel"]
  GAPFILL        : 0
  LABEL          : ["data"]
  LIMITS         : [0, 1]
  REV_LAT        : False
  UNIT           : "-"
  VERIFY_ONCE    : True

# GriddingMachine configuration
GRIDDINGMACHINE:
  TAG : CI
  REVISION : "R1"
