# File name patterns
# Note that if YYYY does not exist, then it is not a duplicated task
# These keys are mandatory:
#     - PATTERN
#     - PREFIX
#     - NX
#     - MT
#     - VV
FILE:
  PATTERN : "PREFIX_NX_MT_VV.nc"
  PREFIX  : ["CHL"]
  NX      : [2]
  MT      : ["7D"]
  VV      : ["V1"]

# Folder structure for input and output
FOLDER:
  ORIGINAL    : "v0"
  REPROCESSED : "v0"

# Data configuration
# Note that the labels should match the PREFIX in FILE section
DATA:
  ABOUT          : "CHL from Croft H. et al.(2020) (https://doi.org/10.1016/j.rse.2019.111479)"
  CHANGE_LOGS    : ["The original data was Geo TIFF files, and we converted them to NetCDF format", "The original data was from 90 N to 90 S, and we converted it to from 90 S to 90 N", "There was no uncertainty included, and we added an empty matrix filled with NaN"]
  GAPFILL        : mean
  LABEL          : ["data"]
  LIMITS         : [0, 1]
  REV_LAT        : False
  UNIT           : "-"
  VERIFY_ONCE    : True

# GriddingMachine configuration
GRIDDINGMACHINE:
  TAG : CHL
  REVISION : "R1"
