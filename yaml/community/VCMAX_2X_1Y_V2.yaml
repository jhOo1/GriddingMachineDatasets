# File name patterns
# Note that if YYYY does not exist, then it is not a duplicated task
# These keys are mandatory:
#     - PATTERN
#     - PREFIX
#     - NX
#     - MT
#     - VV
FILE:
  PATTERN : "PREFIX_NX_MT_VV.nc"
  PREFIX  : ["VCMAX"]
  NX      : [2]
  MT      : ["1Y"]
  VV      : ["V2"]

# Folder structure for input and output
FOLDER:
  ORIGINAL    : "v0"
  REPROCESSED : "v0"

# Data configuration
# Note that the labels should match the PREFIX in FILE section
DATA:
  ABOUT          : "VCMAX from Luo X. et al.(2021) (https://doi.org/10.1038/s41467-021-25163-9)"
  CHANGE_LOGS    : ["The original data was store as data[lat, lon], and we transformed that to data[lon,lat]","The original lat was from north to south, and we reorgainized it from south to north"]
  GAPFILL        : mean
  LABEL          : ["data"]
  LIMITS         : [0, 1]
  REV_LAT        : False
  UNIT           : "μmol m⁻² s⁻¹"
  VERIFY_ONCE    : True

# GriddingMachine configuration
GRIDDINGMACHINE:
  TAG : SLA
  REVISION : "R1"
