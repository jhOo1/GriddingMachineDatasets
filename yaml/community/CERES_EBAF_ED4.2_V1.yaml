# File name patterns
# Note that if YYYY does not exist, then it is not a duplicated task
# These keys are mandatory:
#     - PATTERN
#     - PREFIX
#     - NX
#     - MT
#     - VV
SCHEMA_VERSION: 1

FILE:
  PATTERN : "PREFIX_NX_MT_YYYY_VV.nc"
  PREFIX  : ["CLOUD_FRACTION_CERES_EBAF_ED4.2"]
  NX      : [1]
  MT      : ["1M"]
  YYYY    : [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023]
  VV      : ["V1"]

# Folder structure for input and output
FOLDER:
  ORIGINAL    : "CERES/EBAF_ED4.2"
  REPROCESSED : "CERES/EBAF_ED4.2"

# Data configuration
# Note that the labels should match the PREFIX in FILE section
DATA:
  ABOUT          : "CERES EBAF data edition 4.2 from Earthdata"
  CHANGE_LOGS    : ["Separate to individual variables and files"]
  GAPFILL        : "KEEP_AS_IS"
  FLIP_LON       : True
  LABEL          : ["CLOUD_FRACTION"]
  LIMITS         : [0, 1]
  SCALING        : "linear"
  SCALING_FACTOR : [0.01, 0]
  UNIT           : "unitless"
  VERIFY_ONCE    : True

# GriddingMachine configuration
GRIDDINGMACHINE:
  TAG : CLOUD_FRACTION_CERES_EBAF_ED4.2
